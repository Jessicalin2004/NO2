<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: 地鐵路線圖的語彙。頂部五色條對應五大項，地圖在前，清單依大項分段，每列附站號與出口。 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#14202b; --muted:#566574; --line:#d5dce2; --accent:#0b5cad;
  --water:#cfe3f0; --land:#e1e7ec; --land-n:#edf0f3;
  --c-outlet:#d6165f; --c-market:#c25a0a; --c-district:#0a55a8; --c-culture:#087a3b; --c-food:#8654a0;
  --on-c:#ffffff;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-num:'Space Grotesk','Noto Sans TC',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --surface:#17212c; --ink:#e8eef3; --muted:#9db0bf; --line:#2a3947; --accent:#6db3f2;
    --water:#1c3446; --land:#243443; --land-n:#1a2631;
    --c-outlet:#ff5c97; --c-market:#ff9a45; --c-district:#5ea8f5; --c-culture:#3ecf78; --c-food:#b98ad6;
    --on-c:#0f1720; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17212c; --ink:#e8eef3; --muted:#9db0bf; --line:#2a3947; --accent:#6db3f2;
  --water:#1c3446; --land:#243443; --land-n:#1a2631;
  --c-outlet:#ff5c97; --c-market:#ff9a45; --c-district:#5ea8f5; --c-culture:#3ecf78; --c-food:#b98ad6;
  --on-c:#0f1720; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--font-body);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stripe{display:grid;grid-template-columns:repeat(5,1fr);height:6px}
.stripe span:nth-child(1){background:var(--c-outlet)}
.stripe span:nth-child(2){background:var(--c-market)}
.stripe span:nth-child(3){background:var(--c-district)}
.stripe span:nth-child(4){background:var(--c-culture)}
.stripe span:nth-child(5){background:var(--c-food)}

.hero{padding-block:36px 24px}
.eyebrow{font:500 12px/1 var(--font-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font-size:clamp(2.1rem,7vw,3.6rem);line-height:1.1;font-weight:900;margin:0 0 12px;text-wrap:balance}
.lead{max-width:36em;color:var(--muted);margin:0 0 18px}
.progress{font:500 13px/1.4 var(--font-num);color:var(--muted);margin:0 0 18px}
.progress b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible,.mk:focus-visible,.pick input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip em{font:500 12px var(--font-num);font-style:normal;color:var(--muted)}

.mapsec{padding-block:20px 8px}
.mapsec h2,.cat-head h2{font-size:1.35rem;line-height:1.3;margin:0}
.maps{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.land{fill:var(--land-n);stroke:var(--line);stroke-width:1}
.land-s{fill:var(--land);stroke:var(--muted);stroke-width:1}
.river{fill:none;stroke:var(--water);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.maplabel{font:500 11px var(--font-body);fill:var(--muted)}
.maplabel.strong{font-weight:700;fill:var(--ink);font-size:12px}
.mk{cursor:pointer}
.mk circle{fill:var(--c);stroke:var(--surface);stroke-width:2}
.mk text{fill:var(--on-c);font:700 12px var(--font-num);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.picked circle{stroke:var(--ink);stroke-width:3}
.mk:hover circle{stroke:var(--ink)}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;list-style:none;padding:0;margin:12px 0 0;font-size:13px}
.index li{display:flex;align-items:center;gap:7px;min-width:0}
.index b{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--on-c);font:700 11px var(--font-num)}

main{padding-block:12px 56px}
.cat{padding-top:32px}
.cat-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-bottom:10px;border-bottom:2px solid var(--c)}
.cat-head h2{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.cat-head p{margin:0;color:var(--muted);font-size:14px}
.cnt{margin-left:auto;font:500 13px var(--font-num);color:var(--muted)}
.spots{list-style:none;margin:0;padding:0}
.spot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 14px;padding:18px 0;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.spot.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 22%,transparent)}100%{background:transparent}}
.num{grid-row:1;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font:700 15px var(--font-num)}
.main{min-width:0}
.main h3{margin:0;font-size:1.1rem;line-height:1.4;text-wrap:balance}
.sub{margin:0;font-size:13.5px;color:var(--c);font-weight:700}
.note{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:42em}
.pick{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;cursor:pointer}
.pick input{width:16px;height:16px;accent-color:var(--c);margin:0}
.meta{grid-column:2;margin:6px 0 0;display:grid;gap:6px;min-width:0}
.meta div{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:baseline}
.meta dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.meta dd{margin:0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.st{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-right:10px}
.code{display:inline-block;min-width:2.6em;padding:0 8px;border-radius:999px;border:1.5px solid var(--ink);font:700 12px/1.6 var(--font-num);text-align:center;font-variant-numeric:tabular-nums}
@media (min-width:860px){
  .spot{grid-template-columns:40px minmax(0,1fr) minmax(0,300px);gap:0 22px}
  .meta{grid-column:3;grid-row:1;margin:0}
}
@media (max-width:760px){
  .maps{grid-template-columns:1fr}
  .maps figure:first-child{max-width:320px}
}
@media (prefers-reduced-motion:reduce){.spot.flash{animation:none}}
</style>

    '<line x1="'+(sx+6).toFixed(1)+'" y1="'+(sy+6).toFixed(1)+'" x2="'+(sx+30).toFixed(1)+'" y2="'+(sy+22).toFixed(1)+'" stroke="var(--muted)" stroke-width="1"/>'+
    '<text class="maplabel strong" x="'+(sx+33).toFixed(1)+'" y="'+(sy+30).toFixed(1)+'">首爾</text>'+
    '<circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<line x1="'+(px-6).toFixed(1)+'" y1="'+(py-6).toFixed(1)+'" x2="'+(px-32).toFixed(1)+'" y2="'+(py-26).toFixed(1)+'" stroke="var(--muted)" stroke-width="1"/>'+
    '<text class="maplabel strong" x="'+(px-34).toFixed(1)+'" y="'+(py-30).toFixed(1)+'" text-anchor="end">坡州</text>'+
    '<g class="mk" data-id="4" style="--c:var(--c-outlet)" tabindex="0" role="link" aria-label="4 樂天坡州"><title>樂天坡州</title><circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="8"/><text x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" style="font-size:10px">4</text></g>'+
    '</svg>';
  $('#korea-map').innerHTML=kmap;

  /* Seoul map */
  var L0=126.875,LAT1=37.595,S=4000,K=Math.cos(37.5*Math.PI/180),P=14;
  function mx(lon){return P+(lon-L0)*K*S;}
  function my(lat){return P+(LAT1-lat)*S;}
  var river=[[126.875,37.570],[126.905,37.553],[126.93,37.535],[126.96,37.518],[126.99,37.515],[127.015,37.525],[127.045,37.532],[127.07,37.528]];
  var rd='M'+river.map(function(p){return mx(p[0]).toFixed(1)+' '+my(p[1]).toFixed(1);}).join('L');
  var smap='<svg viewBox="0 0 646 528" role="img" aria-label="首爾市區地圖，標號對應地點清單">'+
    '<rect x="0" y="0" width="646" height="528" rx="8" fill="var(--land)"/>'+
    '<path class="river" d="'+rd+'"/>'+
    '<text class="maplabel" x="'+mx(126.953).toFixed(1)+'" y="'+my(37.5225).toFixed(1)+'">漢江</text>'+
    SPOTS.filter(function(s){return s.ll;}).map(function(s){
      var x=mx(s.ll[0]).toFixed(1),y=my(s.ll[1]).toFixed(1);
      return '<g class="mk" data-id="'+s.id+'" style="--c:var(--c-'+s.cat+')" tabindex="0" role="link" aria-label="'+s.id+' '+s.short+'"><title>'+s.short+'</title><circle cx="'+x+'" cy="'+y+'" r="11"/><text x="'+x+'" y="'+y+'">'+s.id+'</text></g>';
    }).join('')+'</svg>';
  $('#seoul-map').innerHTML=smap;

  $('#index').innerHTML=SPOTS.map(function(s){
    return '<li style="--c:var(--c-'+s.cat+')"><b>'+s.id+'</b>'+s.short+'</li>';
  }).join('');

  /* picks */
  var KEY='seoul-trip-picked';
  var picked={};
  try{var raw=localStorage.getItem(KEY);if(raw)picked=JSON.parse(raw)||{};}catch(e){picked={};}
  function sync(){
    var n=0;
    SPOTS.forEach(function(s){
      var on=!!picked[s.id];if(on)n++;
      var cb=document.getElementById('pick-'+s.id);if(cb)cb.checked=on;
      document.querySelectorAll('.mk[data-id="'+s.id+'"]').forEach(function(g){g.classList.toggle('picked',on);});
    });
    $('#picked-n').textContent=n;
  }
  $('#total-n').textContent=SPOTS.length;
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t&&t.matches&&t.matches('.pick input')){
      picked[t.getAttribute('data-id')]=t.checked;
      try{localStorage.setItem(KEY,JSON.stringify(picked));}catch(err){}
      sync();
    }
  });
  sync();

  /* navigation */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(id,flash){
    var el=document.getElementById(id);if(!el)return;
    el.scrollIntoView({behavior:reduce?'auto':'smooth',block:flash?'center':'start'});
    if(flash){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('[data-go]');
    if(a){e.preventDefault();go(a.getAttribute('data-go'),false);return;}
    var g=e.target.closest&&e.target.closest('.mk');
    if(g)go('spot-'+g.getAttribute('data-id'),true);
  });
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('mk')){
      e.preventDefault();go('spot-'+e.target.getAttribute('data-id'),true);
    }
  });
})();
</script>

</body></html>
